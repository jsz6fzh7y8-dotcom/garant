<script>
// Supabase public client configuration. Publishable keys are intended for browser use; protect data with RLS.
const GARANT_SUPABASE_URL = 'https://qbegrexbhwdncmqtzikt.supabase.co';
const GARANT_SUPABASE_KEY = 'sb_publishable_zjNaBV3m6khLU_FeAagAtQ_P0DYxAmI';
const garantSupabase = window.supabase.createClient(GARANT_SUPABASE_URL, GARANT_SUPABASE_KEY);
</script>
<script>
/* Реальный режим: сделки, чат и виртуальный баланс через Supabase (токен 'sb'). Демо-режим остаётся на локальной имитации. */
window.PAY_DETAILS='ТЕСТОВЫЕ РЕКВИЗИТЫ\nКарта: 0000 0000 0000 0000\nПолучатель: Гарант (демо)\nВиртуальные деньги: реальный перевод не нужен.';
window.realHandle=async function(method,url,body){
 const sb=garantSupabase,b=body||{};
 const FAIL=(msg,field)=>[400,{error:msg,field}];
 const sh=id=>'DL-'+String(id).slice(0,5).toUpperCase();
 try{
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return[401,{error:'Войдите в аккаунт'}];
  const user=session.user,me=user.id;
  const rpc=async(fn,args)=>{const r=await sb.rpc(fn,args);if(r.error)throw r.error;return r.data};
  let m;
  if(method==='GET'&&url==='/api/state'){
   const rd=await sb.from('deals').select('*').order('created_at',{ascending:false});if(rd.error)throw rd.error;
   const deals=rd.data||[],ids=deals.map(d=>d.id);let msgs=[];
   if(ids.length){const rm=await sb.from('messages').select('*').in('deal_id',ids).order('created_at',{ascending:true});if(rm.error)throw rm.error;msgs=rm.data||[]}
   const uids=new Set([me]);deals.forEach(d=>[d.buyer_id,d.seller_id,d.creator_id].forEach(x=>x&&uids.add(x)));
   const [rp,wl,tx,rq,pu,ev]=await Promise.all([
    sb.from('profiles').select('id,username,created_at').in('id',[...uids]),
    sb.from('wallets').select('balance').eq('user_id',me).maybeSingle(),
    sb.from('transactions').select('*').order('created_at',{ascending:false}),
    sb.from('payment_requests').select('*').order('created_at',{ascending:false}),
    sb.from('promo_uses').select('code'),
    ids.length?sb.from('deal_events').select('*').in('deal_id',ids).order('created_at',{ascending:true}):Promise.resolve({data:[]})
   ]);
   const pm={};(rp.data||[]).forEach(p=>pm[p.id]=p);
   const myName=(pm[me]&&pm[me].username)||(user.user_metadata&&user.user_metadata.name)||String(user.email).split('@')[0];
   if(!pm[me]){try{await sb.from('profiles').insert({id:me,username:myName})}catch(e){}}
   const bal=wl&&wl.data?Number(wl.data.balance):0;
   const users=[...uids].map(id=>id===me
    ?{id,name:myName,avatarUrl:'',rating:null,email:user.email,balance:bal,createdAt:(pm[me]&&pm[me].created_at)||user.created_at,usedPromoCodes:(pu.data||[]).map(x=>x.code)}
    :{id,name:(pm[id]&&pm[id].username)||'Пользователь',avatarUrl:'',rating:null});
   const evs=ev.data||[];
   const dd=deals.map(d=>{
    const cid=d.creator_id||d.buyer_id||d.seller_id,crole=d.creator_role||(d.buyer_id===cid?'buyer':'seller');
    const other=cid===d.buyer_id?d.seller_id:d.buyer_id;
    const mine=evs.filter(e=>e.deal_id===d.id);
    const h=[{id:'c-'+d.id,at:d.created_at,actorId:cid,type:'created',message:'Сделка создана'}];
    if(d.buyer_id&&d.seller_id)h.push({id:'j-'+d.id,at:d.created_at,actorId:other,type:'joined',message:'Второй участник присоединился'});
    mine.forEach(e=>h.push({id:e.id,at:e.created_at,actorId:e.actor_id||null,type:e.type,message:e.message}));
    if(d.status==='cancelled'&&!mine.some(e=>e.type==='cancelled'))h.push({id:'x-'+d.id,at:d.created_at,actorId:cid,type:'cancelled',message:'Сделка отменена'});
    return{id:d.id,short:sh(d.id),invite:d.invite_code,title:d.title,description:d.description,amount:Number(d.amount),currency:d.currency||'RUB',fee:d.fee==null?undefined:Number(d.fee),
     creatorId:cid,creatorRole:crole,sellerId:d.seller_id||undefined,buyerId:d.buyer_id||undefined,status:d.status,createdAt:d.created_at,updatedAt:d.created_at,history:h,
     chat:msgs.filter(x=>x.deal_id===d.id).map(x=>({id:x.id,at:x.created_at,userId:x.sender_id,text:x.body})),reviews:[]};
   });
   const txs=(tx.data||[]).map(t=>({id:t.id,userId:me,type:t.type,amount:Number(t.amount),dealId:t.deal_id||null,dealShort:t.deal_id?sh(t.deal_id):null,createdAt:t.created_at,note:t.note}));
   const reqs=(rq.data||[]).map(r=>({id:r.id,short:(r.type==='deposit'?'D-':'W-')+String(r.id).slice(0,5).toUpperCase(),userId:me,type:r.type,amount:Number(r.amount),status:r.status,code:r.code,requisites:r.requisites,createdAt:r.created_at}));
   return[200,{me,users,deals:dd,tx:txs,requests:reqs,payDetails:window.PAY_DETAILS,demo:false,fee:3,notes:[]}];
  }
  if(method==='POST'&&url==='/api/deals'){
   const a=parseFloat(b.amount);
   const r=await rpc('create_deal',{p_title:String(b.title||''),p_description:String(b.description||''),p_amount:isFinite(a)?a:null,p_role:b.role||null});
   return[200,{id:r.id,msg:'Сделка создана'}];
  }
  if(method==='GET'&&(m=url.match(/^\/api\/deals\/([^/]+)\/preview$/))){
   const r=await rpc('get_deal_by_invite',{p_code:m[1]});
   return[200,{id:m[1],dealId:r.dealId,title:r.title,description:r.description,amount:Number(r.amount),status:r.status,creatorId:r.creatorId,creatorRole:r.creatorRole,creator:{id:r.creatorId,name:r.creatorName,avatarUrl:'',rating:null}}];
  }
  if(method==='DELETE'&&(m=url.match(/^\/api\/deals\/([^/]+)$/))){await rpc('delete_deal',{p_id:m[1]});return[200,{ok:1}]}
  if(method==='POST'&&(m=url.match(/^\/api\/deals\/([^/]+)\/(\w+)$/))){
   const id=m[1],a=m[2];
   if(a==='join'){const r=await rpc('join_deal',{p_code:id});return[200,{msg:'Вы присоединились',dealId:r.dealId}]}
   if(a==='msg'){
    const t=String(b.text||'').trim().slice(0,500);if(!t)return FAIL('Введите сообщение','cm');
    const r=await sb.from('messages').insert({deal_id:id,sender_id:me,body:t});if(r.error)throw r.error;return[200,{ok:1}];
   }
   const FN={pay:'pay_deal',start:'start_deal',done:'done_deal',confirm:'confirm_deal',cancel:'cancel_deal',dispute:'open_dispute'};
   const MS={pay:'Оплачено',start:'Выполнение начато',done:'Отмечено',confirm:'Сделка завершена',cancel:'Сделка отменена',dispute:'Спор открыт'};
   if(FN[a]){await rpc(FN[a],{p_id:id});return[200,{msg:MS[a]}]}
   return FAIL('Отзывы подключим на следующем этапе');
  }
  if(method==='POST'&&url==='/api/deposit'){
   const a=parseFloat(b.amount);const r=await rpc('request_deposit',{p_amount:isFinite(a)?a:null});return[200,{id:r.id,amount:Number(r.amount)}];
  }
  if(method==='POST'&&(m=url.match(/^\/api\/deposit\/([^/]+)\/paid$/))){
   await rpc('mark_deposit_paid',{p_id:m[1]});return[200,{msg:'Спасибо! Платёж проверяется, зачисление после подтверждения администратором'}];
  }
  if(method==='POST'&&url==='/api/withdraw'){
   const a=parseFloat(b.amount);const r=await rpc('request_withdraw',{p_amount:isFinite(a)?a:null,p_requisites:String(b.requisites||'')});
   return[200,{id:r.id,amount:Number(r.amount),requisites:r.requisites}];
  }
  if(method==='POST'&&url==='/api/promo'){
   const r=await rpc('redeem_promo',{p_code:String(b.code||'')});return[200,{msg:'Начислено '+Number(r.amount).toLocaleString('ru-RU')+' ₽'}];
  }
  if(method==='POST'&&url==='/api/admin/requests'){return[200,await rpc('admin_list_requests')]}
  if(method==='POST'&&url==='/api/admin/request'){await rpc('admin_handle_request',{p_id:b.id,p_approve:b.action==='approve'});return[200,{ok:1}]}
  if(method==='POST'&&url==='/api/admin/disputes'){return[200,await rpc('admin_list_disputes')]}
  if(method==='POST'&&url==='/api/admin/resolve'){await rpc('admin_resolve_dispute',{p_id:b.id,p_refund:b.action==='refund'});return[200,{ok:1}]}
  if(method==='POST'&&url==='/api/support'){
   const n=String(b.name||'').trim().slice(0,80),em=String(b.email||'').trim().slice(0,120),s=String(b.subject||'').trim().slice(0,150),ms=String(b.message||'').trim().slice(0,2000);
   if(!n)return FAIL('Введите имя','sn');if(!/^\S+@\S+\.\S+$/.test(em))return FAIL('Некорректный email','se');if(!s)return FAIL('Укажите тему','ss');if(ms.length<5)return FAIL('Опишите вопрос подробнее','sm');
   const r=await sb.from('support_tickets').insert({user_id:me,name:n,email:em,subject:s,message:ms});if(r.error)throw r.error;
   return[200,{msg:'Заявка отправлена! Мы ответим на '+em+' в течение суток.'}];
  }
  if(method==='POST'&&url==='/api/profile'){
   const n=String(b.name||'').trim().slice(0,60);if(!n)return FAIL('Введите имя','nm');
   const r=await sb.from('profiles').update({username:n}).eq('id',me);if(r.error)throw r.error;return[200,{ok:1}];
  }
  if(method==='POST'&&url==='/api/logout'){await sb.auth.signOut();return[200,{ok:1}]}
  if(method==='POST'&&/^\/api\/notes\//.test(url))return[200,{ok:1}];
  return[404,{error:'Не найдено'}];
 }catch(e){
  const t=String((e&&e.message)||'');
  if(/uuid/i.test(t))return FAIL('Не найдено');
  console.error(e);return FAIL(t||'Ошибка');
 }
};

<script>
(function(){

R('POST','/api/admin/request',({body:b})=>{adm(b);const r=DB.requests.find(x=>x.id==b.id);if(!r||!['pending','review','processing'].includes(r.status))bad('Заявка уже обработана');const u=find(r.userId),ok=b.action=='approve';

const pr=promos().find(x=>String(x.code).toUpperCase()==c&&x.active);if(!pr)bad('Промокод не найден','pc');if(u.usedPromoCodes.includes(c))bad('Вы уже использовали этот промокод','pc');

R('POST','/api/admin/promo',({body:b})=>{if(!process.env.ADMIN_KEY||b.key!==process.env.ADMIN_KEY)bad('Нет доступа');const c=String(b.code||'').trim().toUpperCase(),a=r2(b.amount);if(!c||!(a>0))bad('Нужны code и amount');

R('POST','/api/profile',({u,body:b})=>{const n=String(b.name||'').trim().slice(0,60);if(!n)bad('Введите имя','nm');const a=String(b.avatarUrl||'').trim();
if(a&&!/^https?:\/\//.test(a))bad('Нужна ссылка http(s)','au');u.name=n;u.avatarUrl=a||undefined;save()});


async function handle(method,url,token,b){const r=routes.find(r=>r.m==method&&r.re.test(url));if(!r)return[404,{error:'Не найдено'}];const u=find(DB.sessions[token]);if(r.auth&&!u)return[401,{error:'Войдите в аккаунт'}];
try{return[200,r.h({u,tok:token,body:b,p:url.match(r.re).slice(1)})||{ok:1}]}catch(e){if(e&&e.msg)return[400,{error:e.msg,field:e.field}];console.error(e);return[500,{error:'Ошибка'}]}}
const _f=window.fetch.bind(window);window.fetch=async(url,o)=>{o=o||{};if(!String(url).startsWith('/api/'))return _f(url,o);
const tk=((o.headers||{}).Authorization||'').slice(7),pu=String(url).split('?')[0],pb=o.body?JSON.parse(o.body):{};const[c,j]=tk==='sb'?await window.realHandle(o.method||'GET',pu,pb):await handle(o.method||'GET',pu,tk,pb);return{ok:c<400,status:c,json:async()=>j}};
})();
</script>
<script>
const $=s=>document.querySelector(s);
let TOK=null,AS=0;try{TOK=localStorage.getItem('tok')}catch(e){}
let DB={users:[],deals:[],tx:[],notes:[],me:null};const save=()=>{};
async function api(m,p,b){document.querySelectorAll('.er').forEach(e=>e.textContent='');document.querySelectorAll('.bad').forEach(e=>e.classList.remove('bad'));
try{const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(TOK?{Authorization:'Bearer '+TOK}:{})},body:m=='GET'||m=='DELETE'?undefined:JSON.stringify(b||{})});AS=r.status;const j=await r.json().catch(()=>({}));
if(!r.ok){if(j.field&&$('#e-'+j.field))err(j.field,j.error);else toast(j.error||'Ошибка',1);return null}return j}catch(e){AS=0;toast('Нет связи с сервером',1);return null}}
async function sync(){if(!TOK){DB={users:[],deals:[],tx:[],notes:[],me:null};return}const pv=DB.preview,j=await api('GET','/state');
if(j){DB=j;if(pv){DB.preview=pv;if(!usr(pv.creator.id))DB.users.push(pv.creator)}}else if(AS==401){TOK=null;try{localStorage.removeItem('tok')}catch(e){}DB={users:[],deals:[],tx:[],notes:[],me:null}}}
async function pvw(id){const j=await api('GET','/deals/'+id+'/preview');DB.preview=j;if(j&&!usr(j.creator.id))DB.users.push(j.creator)}
const ST={awaiting_participant:['Ждём участника','#6B7280'],awaiting_payment:['Ждёт оплаты','#D97706'],paid:['Оплачена','#2563EB'],in_progress:['В работе','#0EA5A4'],completed:['Завершена','#16A34A'],cancelled:['Отменена','#6B7280'],dispute:['Спор','#DC2626']};
const TT={deposit:'Пополнение',withdraw:'Вывод',escrow_hold:'Заморозка в эскроу',escrow_release:'Выплата из эскроу',promo_bonus:'Промокод',refund:'Возврат'};
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=n=>Number(n).toLocaleString('ru-RU')+' ₽';
const dt=s=>new Date(s).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'});
const now=()=>new Date().toISOString();
const me=()=>DB.users.find(u=>u.id===DB.me),usr=id=>DB.users.find(u=>u.id===id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge=s=>`<span class=badge style="color:${ST[s][1]}">${ST[s][0]}</span>`;
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' err':'');t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3200)}
let R=['home'],PEND=null,F={s:'',q:'',t:''},CB;
const PRIV=['dashboard','new','join','deals','deal','balance','promo','notifs','profile','support'];
let H=[];
async function go(...r){if(JSON.stringify(r)!=JSON.stringify(R))H.push(R);R=r;closeM();if(r[0]=='join'&&TOK)await pvw(r[1]);render();scrollTo(0,0)}
function back(){if(H.length){R=H.pop();closeM();render();scrollTo(0,0)}}
function modal(h){$('#modal').innerHTML=`<div class=ov onclick="if(event.target==this)closeM()"><div class=card style="max-width:400px;width:100%">${h}</div></div>`}
const closeM=()=>$('#modal').innerHTML='';
function ask(msg,fn){CB=fn;modal(`<h3>${msg}</h3><div class=row style="justify-content:flex-end"><button class=btn onclick=closeM()>Нет</button><button class="btn p" onclick="closeM();CB()">Да</button></div>`)}
function err(id,m){const i=$('#'+id),e=$('#e-'+id);if(i)i.classList.toggle('bad',!!m);if(e)e.textContent=m||'';return !!m}
const fld=(id,l,t='text',x='')=>`<label>${l}</label><input class=in id=${id} type=${t} ${x}><div class=er id=e-${id}></div>`;
const val=id=>$('#'+id).value.trim();
function money(u,type,amt,dealId,note){u.balance+=amt;DB.tx.push({id:uid(),userId:u.id,type,amount:amt,dealId,createdAt:now(),note})}
function note(userId,title,body,dealId){DB.notes.push({id:uid(),userId,title,body,read:false,createdAt:now(),dealId})}
function ev(d,type,msg){const u=me();d.history.push({id:uid(),at:now(),actorId:u.id,type,message:msg});d.updatedAt=now();const o=u.id==d.sellerId?d.buyerId:d.sellerId;if(o)note(o,d.title,msg,d.id)}
const av=u=>u.avatarUrl?`<img src="${esc(u.avatarUrl)}" alt="">`:esc(u.name[0].toUpperCase());
const mine=()=>DB.deals.filter(d=>d.sellerId==DB.me||d.buyerId==DB.me||d.creatorId==DB.me).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
const myTx=()=>DB.tx.filter(t=>t.userId==DB.me).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));

function hdr(){const u=me(),n=u?DB.notes.filter(x=>x.userId==u.id&&!x.read).length:0;
const L=[['home','Главная'],['dashboard','Дашборд'],['deals','Сделки'],['balance','Баланс'],['support','Поддержка']];
return `<header><div class="wrap hd">${H.length?'<button class=bk onclick=back() title="Назад" aria-label="Назад">←</button>':''}<a class=logo onclick="go('home')">◆ Гарант</a><nav id=nv onclick="this.classList.remove('open')">${L.map(l=>`<a class="${R[0]==l[0]?'on':''}" onclick="go('${l[0]}')">${l[1]}</a>`).join('')}</nav><div class=sp></div>${u?`<span class=bal onclick="go('balance')">${fmt(u.balance)}</span><a class=bell onclick="go('notifs')">🔔${n?`<i>${n}</i>`:''}</a><a class=av title="Профиль" onclick="go('profile')">${av(u)}</a>`:`<a class="btn p" onclick="go('login')">Войти</a>`}<button class=bg onclick="$('#nv').classList.toggle('open')">☰</button></div></header>`}

function render(){if(PRIV.includes(R[0])&&!me()){PEND=R[0]=='join'?R:null;R=['login']}
if(R[0]=='admin'&&me()&&!isAdmin())R=['nf'];
const p=PG[R[0]]||PG.nf;$('#app').innerHTML=hdr()+`<main><div class=wrap>${p()}</div></main><footer><div class=wrap>© 2026 Гарант · эскроу-сервис · <small style="opacity:.6">Виртуальные деньги · тестовый режим</small> · <a onclick="go('support')">Поддержка</a> · <a onclick="go('rules')">Правила и FAQ</a></div></footer>`;save();if(R[0]=='admin')loadAdmin()}

const dealRow=d=>`<tr><td>${d.short||d.id}</td><td>${esc(d.title)}</td><td>${fmt(d.amount)}</td><td>${badge(d.status)}</td><td>${dt(d.createdAt)}</td><td><button class=btn onclick="go('deal','${d.id}')">Открыть</button></td></tr>`;
const dealTbl=l=>l.length?`<div class=tw><table><tr><th>ID</th><th>Название</th><th>Сумма</th><th>Статус</th><th>Дата</th><th></th></tr>${l.map(dealRow).join('')}</table></div>`:`<p class=m>Сделок пока нет.</p><button class="btn p" onclick="go('new')">Создать сделку</button>`;
const txTbl=l=>l.length?`<div class=tw><table><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Сделка</th><th>Примечание</th></tr>${l.map(t=>`<tr><td>${dt(t.createdAt)}</td><td>${TT[t.type]}</td><td class="${t.amount>0?'pos':'neg'}">${t.amount>0?'+':''}${fmt(t.amount)}</td><td>${t.dealId?`<a onclick="go('deal','${t.dealId}')">${t.dealShort||t.dealId}</a>`:'—'}</td><td>${esc(t.note||'')}</td></tr>`).join('')}</table></div>`:`<p class=m>Операций пока нет.</p>`;

const PG={
home(){const u=me();return `<div class=hero><h1>Гарант для<br>ваших сделок</h1><p>Покупайте и продавайте с уверенностью. Деньги защищены эскроу до подтверждения получения.</p><div class=row style="justify-content:center"><button class="btn p" onclick="go('${u?'new':'register'}')">Создать сделку</button><button class=btn onclick="go('${u?'balance':'register'}')">Пополнить баланс</button><button class="btn" onclick="openDemoMode()">↗ Открыть демо-кабинет</button></div><p class="m" style="margin-top:18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase">DEMO ENVIRONMENT · Тестовые данные · Без реальных платежей</p></div>
<h2>Как это работает</h2><div class=grid>${['Создайте сделку и отправьте ссылку','Второй участник присоединяется','Покупатель оплачивает — деньги замораживаются','Получение подтверждено — деньги у продавца'].map((s,i)=>`<div class=card><div class=step>${i+1}</div>${s}</div>`).join('')}</div>
<h2 class=mt style="margin-top:40px">Преимущества</h2><div class=grid><div class=card><h3>Эскроу</h3><span class=m>Деньги не уходят продавцу до завершения.</span></div><div class=card><h3>Безопасность</h3><span class=m>Споры, возвраты и полная история.</span></div><div class=card><h3>Скорость</h3><span class=m>Сделка за пару минут.</span></div></div>
`},
login(){return `<div class=card style="max-width:400px;margin:0 auto"><h2>Вход</h2>${fld('em','Email','email')}${fld('pw','Пароль','password')}<button class="btn p" style="width:100%" onclick=doLogin()>Войти</button><p class=m>Нет аккаунта? <a onclick="go('register')">Регистрация</a></p><div class="divider" style="margin:18px 0;border-top:1px solid var(--line)"></div><button class="btn" style="width:100%" onclick="openDemoMode()">Посмотреть демо без регистрации ↗</button><p class=m style="font-size:12px;margin-top:10px">В демо используются только локальные тестовые данные.</p></div>`},
register(){return `<div class=card style="max-width:400px;margin:0 auto"><h2>Регистрация</h2>${fld('nm','Имя')}${fld('em','Email','email')}${fld('pw','Пароль (мин. 6 символов)','password')}<button class="btn p" style="width:100%" onclick=doReg()>Создать аккаунт</button><p class=m>Уже есть аккаунт? <a onclick="go('login')">Войти</a></p></div>`},
dashboard(){const u=me(),a=mine().filter(d=>!['completed','cancelled'].includes(d.status)).slice(0,5);
return `<h1>Привет, ${esc(u.name)}</h1><div class=card><span class=m>Баланс</span><div class=big>${fmt(u.balance)}</div><div class="row mt"><button class="btn p" onclick="amtM('deposit')">Пополнить</button><button class=btn onclick="amtM('withdraw')">Вывести</button></div></div>
<div class="row mt"><button class="btn p" onclick="go('new')">Создать сделку</button><button class=btn onclick="go('deals')">Мои сделки</button><button class=btn onclick="go('promo')">Промокод</button></div>
<h2 style="margin-top:32px">Активные сделки</h2><div class=card>${dealTbl(a)}</div><h2 style="margin-top:32px">Последние операции</h2><div class=card>${txTbl(myTx().slice(0,5))}</div>`},
new(){return `<h1>Новая сделка</h1><div class=card style="max-width:560px">${fld('ti','Название')}<label>Описание</label><textarea class=in id=ds rows=4></textarea><div class=er id=e-ds></div>${fld('am','Сумма, ₽','number','min=1')}<label>Ваша роль</label><div class=row><label style="margin:0"><input type=radio name=rl value=seller> Я продавец</label><label style="margin:0"><input type=radio name=rl value=buyer> Я покупатель</label></div><div class=er id=e-rl></div>${fld('dl','Срок (необязательно)','date')}<div class=row><button class="btn p" onclick=mkDeal()>Создать сделку</button><button class=btn onclick="go('dashboard')">Отмена</button></div></div>`},
join(){const d=DB.deals.find(x=>x.id==R[1])||(DB.preview&&DB.preview.id==R[1]?DB.preview:null);if(!d)return PG.nf();const mineD=d.creatorId==DB.me;
return `<h1>Приглашение в сделку</h1><div class=card style="max-width:560px"><h3>${esc(d.title)}</h3><p class=m>${esc(d.description)}</p><b>${fmt(d.amount)}</b> · ${badge(d.status)}<p class=m>Создатель: ${esc(usr(d.creatorId).name)} (${d.creatorRole=='seller'?'продавец':'покупатель'})</p>${mineD?'<p>Вы создатель этой сделки</p><button class=btn onclick="go(\'deal\',\''+(d.dealId||d.id)+'\')">Открыть сделку</button>':d.status!='awaiting_participant'?'<p class=m>К сделке уже присоединились.</p>':`<button class="btn p" onclick="joinD('${d.id}')">Присоединиться к сделке</button>`}</div>`},
deals(){return `<div class=row><h1 class=sp>Мои сделки</h1><button class="btn p" onclick="go('new')">Создать</button></div><div class="row" style="margin-bottom:16px"><input class=in style="max-width:260px" placeholder="Поиск по названию или ID" value="${esc(F.q)}" oninput="F.q=this.value;$('#ls').innerHTML=dl()"><select class=in style="max-width:220px" onchange="F.s=this.value;$('#ls').innerHTML=dl()"><option value="">Все статусы</option>${Object.keys(ST).map(k=>`<option value=${k} ${F.s==k?'selected':''}>${ST[k][0]}</option>`).join('')}</select></div><div class=card id=ls>${dl()}</div>`},
deal(){const d=DB.deals.find(x=>x.id==R[1]),u=me();if(!d||![d.sellerId,d.buyerId,d.creatorId].includes(u.id))return PG.nf();
const B=d.buyerId==u.id,S=d.sellerId==u.id,s=d.status,b=[],btn=(l,f,c='')=>`<button class="btn ${c}" onclick="${f}">${l}</button>`;
if(B&&s=='awaiting_payment'){const low=u.balance<d.amount;b.push(`<button class="btn p" ${low?'disabled title="Недостаточно средств"':''} onclick="act('${d.id}','pay')">Оплатить с баланса</button>`+(low?`<span class=m>Недостаточно средств · <a onclick="amtM('deposit')">Пополнить</a></span>`:''))}
if(S&&s=='paid')b.push(btn('Начать выполнение',`act('${d.id}','start')`,'p'));
if(S&&s=='in_progress')b.push(btn('Отметить выполнение',`act('${d.id}','done')`));
if(B&&(s=='paid'||s=='in_progress'))b.push(btn('Подтвердить получение',`act('${d.id}','confirm')`,'p'));
if((B||S)&&['awaiting_payment','paid','in_progress'].includes(s))b.push(btn('Отменить сделку',`act('${d.id}','cancel')`,'d'));
if((B||S)&&['paid','in_progress'].includes(s))b.push(btn('Открыть спор',`act('${d.id}','dispute')`,'d'));
const link=location.href.split('#')[0]+'#join-'+(d.invite||d.id);
return `<p class=m><a onclick="go('deals')">← Сделки</a></p><div class=row><h1 class=sp>${esc(d.title)}</h1>${badge(s)}</div><div class=grid><div class=card><span class=m>${d.short||d.id}</span><p>${esc(d.description)}</p><div class=big>${fmt(d.amount)}</div><p class=m>Комиссия сервиса ${DB.fee}% (${fmt(Math.round(d.amount*DB.fee)/100)}) удерживается при выплате продавцу.</p><p class=m>Продавец: ${nm(d.sellerId)}<br>Покупатель: ${nm(d.buyerId)}<br>Срок: ${d.deadline||'не указан'}</p></div><div class=card><h3>Действия</h3>${s=='dispute'?'<div class="card un">Спор открыт, ожидает решения</div>':''}<div class=row>${b.join('')||'<span class=m>Нет доступных действий</span>'}</div>${s=='awaiting_participant'?`<p class=m style="margin-top:16px">Ссылка-приглашение:</p><input class=in readonly value="${esc(link)}"><button class="btn p mt" onclick="cp('${link}')">Скопировать ссылку</button>${d.creatorId==u.id?`<button class="btn d mt" style="margin-left:8px" onclick="rmDeal('${d.id}')">Удалить</button>`:''}`:''}</div></div>${(B||S)&&d.sellerId&&d.buyerId?chatBox(d):''}${(B||S)?revBox(d):''}<h2 style="margin-top:32px">История</h2><div class=tl>${d.history.map(h=>`<div><b>${esc(h.message)}</b><br><span class=m>${dt(h.at)} · ${esc((usr(h.actorId)||{name:'Администратор'}).name)}</span></div>`).join('')}</div>`},
balance(){const u=me(),l=myTx().filter(t=>!F.t||t.type==F.t);return `<h1>Баланс</h1><div class=card><div class=big>${fmt(u.balance)}</div><div class="row mt"><button class="btn p" onclick="amtM('deposit')">Пополнить</button><button class=btn onclick="amtM('withdraw')">Вывести</button></div></div><h2 style="margin-top:24px">Заявки на пополнение и вывод</h2><div class=card>${reqTbl()}</div><div class=row style="margin:24px 0 12px"><h2 class=sp style="margin:0">История операций</h2><select class=in style="max-width:220px" onchange="F.t=this.value;render()"><option value="">Все типы</option>${Object.keys(TT).map(k=>`<option value=${k} ${F.t==k?'selected':''}>${TT[k]}</option>`).join('')}</select></div><div class=card>${txTbl(l)}</div>`},
promo(){const u=me();return `<h1>Промокоды</h1><div class=card style="max-width:460px">${fld('pc','Промокод')}<button class="btn p" onclick=doPromo()>Активировать</button></div><h2 style="margin-top:32px">Активированные</h2>${u.usedPromoCodes.length?u.usedPromoCodes.map(c=>`<span class=badge style="color:#0EA5A4;margin-right:8px">${c}</span>`).join(''):'<p class=m>Пока нет.</p>'}`},
notifs(){const l=DB.notes.filter(n=>n.userId==DB.me).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `<div class=row><h1 class=sp>Уведомления</h1><button class=btn onclick="readAll()">Отметить все прочитанными</button></div>${l.length?l.map(n=>`<div class="card ${n.read?'':'un'}" style="margin-bottom:10px;cursor:pointer" onclick="rd('${n.id}')"><b>${esc(n.title)}</b><br>${esc(n.body)}<br><span class=m>${dt(n.createdAt)}</span></div>`).join(''):'<p class=m>Уведомлений нет.</p>'}`},
profile(){const u=me();return `<h1>Профиль</h1><div class=card style="max-width:460px"><div class=row><span class=av style="width:56px;height:56px">${av(u)}</span><div><b>${esc(u.name)}</b><br><span class=m>${esc(u.email)} · с ${dt(u.createdAt)}</span></div></div>${fld('nm','Имя','text','value="'+esc(u.name)+'"')}${fld('au','URL аватара','text','value="'+esc(u.avatarUrl||'')+'"')}<div class=row><button class="btn p" onclick=saveProf()>Сохранить</button><button class="btn d" onclick="ask('Выйти из аккаунта?',logout)">Выйти</button></div></div>`},
rules(){const Q=[['Как работает гарантия?','Покупатель вносит оплату на баланс сервиса, деньги замораживаются и не поступают продавцу, пока покупатель не подтвердит получение.'],['Когда продавец получает деньги?','После нажатия «Подтвердить получение». Из суммы удерживается комиссия сервиса, её размер указан в карточке сделки.'],['Что если покупатель не получил товар или услугу?','Сделку можно отменить, деньги вернутся покупателю. Если стороны не договорились, любая из них может открыть спор.'],['Как решается спор?','Администратор изучает переписку в чате сделки и решает: вернуть деньги покупателю или выплатить продавцу. Решение окончательное.'],['Можно ли отменить сделку?','Да, до завершения. Если деньги уже были оплачены, они возвращаются покупателю полностью.'],['Как пополнить баланс и вывести деньги?','Создайте заявку на пополнение, переведите сумму по реквизитам с кодом платежа и нажмите «Я оплатил»: после проверки администратором баланс пополнится. Для вывода создайте заявку с реквизитами, сумма сразу списывается, выплата выполняется вручную.'],['Что делать, если забыл пароль?','Обратитесь к администратору сервиса, он поможет восстановить доступ.']];
return `<h1>Правила и FAQ</h1>${Q.map(q=>`<div class=card style="margin-bottom:12px"><h3>${q[0]}</h3><span class=m>${q[1]}</span></div>`).join('')}`},

const dl=()=>dealTbl(mine().filter(d=>(!F.s||d.status==F.s)&&(!F.q||(d.title+d.id+(d.short||'')).toLowerCase().includes(F.q.toLowerCase()))));

let LAST_REG_EMAIL='';
const ADMIN_EMAIL='mm7g7s@gmail.com';
const isAdmin=()=>{const u=me();return !!(u&&u.email&&u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase())};
async function resendConfirm(email){
const {error}=await garantSupabase.auth.resend({type:'signup',email});
if(error){toast(error.message||'Не удалось отправить письмо',1);return}
toast('Письмо отправлено повторно');
}
async function doReg(){
  document.querySelectorAll('.er').forEach(e=>e.textContent='');
  const name=val('nm'), email=val('em'), password=$('#pw').value;
  if(!name){err('nm','Введите имя');return} if(!/^\S+@\S+\.\S+$/.test(email)){err('em','Некорректный email');return} if(password.length<6){err('pw','Минимум 6 символов');return}
  const {data,error}=await garantSupabase.auth.signUp({email,password,options:{data:{name}}});
  if(error){toast(error.message||'Не удалось зарегистрироваться',1);return}
  if(data.session){toast('Аккаунт создан! Теперь можно войти.');go('login')}
  else {LAST_REG_EMAIL=email;modal('<h3>Почти готово!</h3><p>Мы отправили письмо для подтверждения email на <b>'+esc(email)+'</b>. Открой почту, перейди по ссылке, затем вернись и войди.</p><div class=row style="margin-top:14px"><button class="btn p" onclick="closeM();go(\'login\')">Перейти ко входу</button><button class=btn onclick="resendConfirm(LAST_REG_EMAIL)">Отправить письмо ещё раз</button></div>')}
}
async function doLogin(){
  document.querySelectorAll('.er').forEach(e=>e.textContent='');
  const email=val('em'), password=$('#pw').value;
  if(!email){err('em','Введите email');return} if(!password){err('pw','Введите пароль');return}
  const {data,error}=await garantSupabase.auth.signInWithPassword({email,password});
  if(error){
   const unconfirmed=/confirm/i.test(error.message||'')||error.code==='email_not_confirmed';
   if(unconfirmed){LAST_REG_EMAIL=email;modal('<h3>Email ещё не подтверждён</h3><p>Проверьте почту <b>'+esc(email)+'</b> и перейдите по ссылке из письма, затем войдите снова.</p><div class=row style="margin-top:14px"><button class=btn onclick=closeM()>Понятно</button><button class="btn p" onclick="resendConfirm(LAST_REG_EMAIL)">Отправить письмо ещё раз</button></div>')}
   else toast(error.message||'Не удалось войти',1);
   return
  }
  await enter('sb','Вход выполнен')
}
async function enter(t,m){TOK=t;try{localStorage.setItem('tok',t)}catch(e){}await sync();toast(m);after()}
function after(){const p=PEND;PEND=null;H=[];p?go(...p):go('dashboard')}
async function logout(){await api('POST','/logout',{});TOK=null;try{localStorage.removeItem('tok')}catch(e){}DB={users:[],deals:[],tx:[],notes:[],me:null};H=[];R=['home'];render()}
function amtM(k){modal(k=='deposit'?`<h3>Пополнение баланса</h3>${fld('ma','Сумма, ₽ (от 100)','number','min=100')}<p class=m>Далее вы получите реквизиты для оплаты.</p><div class=row style="justify-content:flex-end"><button class=btn onclick=closeM()>Отмена</button><button class="btn p" onclick="doAmt('deposit')">Продолжить</button></div>`:`<h3>Вывод средств</h3><p class=m>Доступно: ${fmt(me().balance)}</p>${fld('ma','Сумма, ₽','number','min=1')}${fld('rq','Реквизиты: номер карты или телефон (СБП) и банк')}<div class=row style="justify-content:flex-end"><button class=btn onclick=closeM()>Отмена</button><button class="btn p" onclick="doAmt('withdraw')">Вывести</button></div>`)}

function payM(id){const r=DB.requests.find(x=>x.id==id);modal(`<h3>Оплатите ${fmt(r.amount)}</h3>${DB.demo?'<div class="card un">Карта: <b>4242 4242 4242 4242</b>, 12/30, CVC 123</div>':`<p class=m>Реквизиты для перевода:</p><div class=card style="white-space:pre-wrap">${esc(DB.payDetails)}</div><p class=m>В комментарии к переводу укажите код <b>${r.code}</b>. После оплаты нажмите «Я оплатил». Зачисление после проверки, обычно в течение часа.</p>`}<div class=row style="justify-content:flex-end"><button class=btn onclick=closeM()>Позже</button><button class="btn p" onclick="paidD('${r.id}')">Я оплатил</button></div>`)}

async function sendSupport(){
if(val('hp')){toast('Заявка отправлена! Мы ответим в течение суток.');return}
const last=+(localStorage.getItem('support_last_sent')||0);if(Date.now()-last<20000){toast('Подождите немного перед повторной отправкой',1);return}
const j=await api('POST','/support',{name:val('sn'),email:val('se'),subject:val('ss'),message:$('#sm').value});
if(j){localStorage.setItem('support_last_sent',String(Date.now()));toast(j.msg);$('#sm').value='';$('#ss').value=''}
}
async function loadAdmin(){
if(!isAdmin())return;
const rq=await api('POST','/admin/requests',{key:'demo'}),ds=await api('POST','/admin/disputes',{key:'demo'});if(!$('#ad'))return;
const rh=(rq&&rq.length)?rq.map(r=>`<div class=card style="margin-bottom:10px"><b>${r.type=='deposit'?'Пополнение':'Вывод'} · ${fmt(r.amount)} · ${RS[r.status][0]}</b><br>${esc(r.name)} · ${esc(r.email)}<br><div class=m>${r.type=='deposit'?'Код платежа: '+esc(r.code||''):'Реквизиты: '+esc(r.requisites||'')}</div><div class="row mt"><button class="btn p" onclick="handleReq('${r.id}','approve')">${r.type=='deposit'?'Зачислить':'Выплачено'}</button><button class=btn onclick="handleReq('${r.id}','reject')">Отклонить</button></div></div>`).join(''):'<p class=m>Заявок нет.</p>';
const dh=(ds&&ds.length)?ds.map(x=>`<div class=card style="margin-bottom:10px"><b>${x.short||x.id} · ${esc(x.title)} · ${fmt(x.amount)}</b><br>Продавец: ${esc(x.seller)} · Покупатель: ${esc(x.buyer)}<br><div class=m>${x.chat.map(esc).join('<br>')}</div><div class="row mt"><button class="btn p" onclick="resolveDispute('${x.id}','release')">Выплатить продавцу</button><button class=btn onclick="resolveDispute('${x.id}','refund')">Вернуть покупателю</button></div></div>`).join(''):'<p class=m>Открытых споров нет.</p>';
$('#ad').innerHTML='<h2>Заявки на пополнение и вывод</h2>'+rh+'<h2 style="margin-top:24px">Споры</h2>'+dh}
function handleReq(id,a){if(!isAdmin())return;ask(a=='approve'?'Подтвердить заявку?':'Отклонить заявку?',async()=>{const j=await api('POST','/admin/request',{key:'demo',id,action:a});if(j){toast('Готово');await sync();go('admin')}})}
function resolveDispute(id,a){if(!isAdmin())return;ask('Решение окончательное. Продолжить?',async()=>{const j=await api('POST','/admin/resolve',{key:'demo',id,action:a});if(j){toast('Спор решён');await sync();go('admin')}})}
setInterval(async()=>{if(!TOK||$('#modal').innerHTML||document.activeElement&&document.activeElement.matches('input,textarea,select'))return;const o=JSON.stringify(DB);await sync();if(JSON.stringify(DB)!=o)render()},5000);
(async()=>{await sync();if(location.hash.startsWith('#join-')){PEND=['join',location.hash.slice(6)];if(me())return after()}render()})();
